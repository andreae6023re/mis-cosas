<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1EFEA">
<meta name="description" content="Mis cosas — tu organizador personal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mis cosas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="authScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="brand auth-brand">Mis cosas</div>
    <p class="eyebrow">Tu espacio personal</p>
    <h1 id="authTitle">Iniciar sesión</h1>
    <p id="authSubtitle" class="muted">Accede para tener tus datos sincronizados entre dispositivos.</p>
    <form id="authForm" class="form">
      <label>Email<input id="authEmail" type="email" autocomplete="email" required></label>
      <label>Contraseña<input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></label>
      <button id="authSubmit" class="primary" type="submit">Entrar</button>
    </form>
    <div id="authMessage" class="auth-message" aria-live="polite"></div>
    <button id="authToggle" class="text-button auth-toggle" type="button">¿No tienes cuenta? Crear una</button>
  </div>
</div>
<div class="app hidden" id="appShell">
<aside class="sidebar">
  <div class="brand">Mis cosas</div>
  <nav id="nav">
    <button data-view="home" class="active">Inicio</button>
    <button data-view="tasks">Tareas</button>
    <button data-view="expenses">Gastos</button>
    <button data-view="food">Comidas</button>
    <div class="sep"></div>
    <button data-view="calendar">Calendario</button>
    <button data-view="habits">Hábitos</button>
    <div class="sep"></div>
    <button data-view="settings">Ajustes</button>
  </nav>
</aside>
<div class="menu-backdrop" aria-hidden="true"></div>
<main>
<header>
  <button id="menuBtn" class="icon mobile" aria-label="Menú">☰</button>
  <div><h1 id="pageTitle">Inicio</h1><p id="pageSubtitle"></p></div>
  <div class="header-actions"><span id="syncStatus" class="sync-status" aria-live="polite">☁️ Sincronizado</span><button id="quickAdd" class="add" aria-label="Añadir">+</button></div>
</header>
<section id="content"></section>
</main>
<nav class="bottom-nav">
  <button data-view="home" class="active">Inicio</button>
  <button data-view="tasks">Tareas</button>
  <button data-view="expenses">Gastos</button>
  <button data-view="food">Comidas</button>
</nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Cerrar">×</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw-v68.js');</script>

<script>
(function(){
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(event){
    event.preventDefault();
    deferredInstallPrompt = event;
    document.querySelectorAll('[data-install-app]').forEach(function(btn){ btn.hidden = false; });
  });
  window.addEventListener('appinstalled', function(){
    deferredInstallPrompt = null;
    document.querySelectorAll('[data-install-app]').forEach(function(btn){ btn.hidden = true; });
  });
  document.addEventListener('click', function(event){
    const btn = event.target.closest && event.target.closest('[data-install-app]');
    if(!btn || !deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){ deferredInstallPrompt = null; });
  });
  window.misCosasCanInstall = function(){ return !!deferredInstallPrompt; };
})();
</script>
</body>
</html>
